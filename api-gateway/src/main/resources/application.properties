spring.application.name=api-gateway
server.port=9090

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.server-name=${spring.application.name}:${server.port}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=20s

# Discovery
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

#Routes
#course-ms
spring.cloud.gateway.server.webflux.routes[0].id=course-ms
spring.cloud.gateway.server.webflux.routes[0].uri=lb://course-ms
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/courses/**

#student-ms
spring.cloud.gateway.server.webflux.routes[1].id=student-ms
spring.cloud.gateway.server.webflux.routes[1].uri=lb://student-ms
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/students/**

#enrollment-ms
spring.cloud.gateway.server.webflux.routes[2].id=enrollment-ms
spring.cloud.gateway.server.webflux.routes[2].uri=lb://enrollment-ms
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/enrollments/**